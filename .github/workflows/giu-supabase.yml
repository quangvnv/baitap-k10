# Giữ project Supabase không bị tạm dừng (gói Free dừng sau 7 ngày không hoạt động).
#
# Mỗi 3 ngày gửi MỘT câu đọc vào CSDL bằng anon key. Key này vốn công khai trong cauhinh.js,
# RLS chặn anon mọi bảng nên kết quả luôn là mảng rỗng — nhưng truy vấn vẫn chạy trong
# Postgres, tức là có hoạt động. Không cần secret, không ghi gì.
#
# Lưu ý: GitHub tự TẮT workflow theo lịch nếu repo không có commit nào trong 60 ngày
# (có gửi email báo trước) — khi đó vào tab Actions bấm bật lại.
name: Giữ Supabase hoạt động

on:
  schedule:
    - cron: '17 1 */3 * *'   # 01:17 UTC (08:17 giờ VN), mỗi 3 ngày
  workflow_dispatch:          # cho phép bấm chạy tay ở tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Đọc thử một bảng
        env:
          SB_URL: https://czijkjddblewfpwmjgvk.supabase.co
          SB_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWpramRkYmxld2Zwd21qZ3ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDA2MTEsImV4cCI6MjEwMzU3NjYxMX0.u1YHWfdoCoOVPApFjVSU3e39_32192H0nEhXNAapsT8
        run: |
          for lan in 1 2 3; do
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 30 \
              "$SB_URL/rest/v1/phien?select=id&limit=1" \
              -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON")
            echo "Lần $lan: HTTP $code — $(head -c 200 body.txt)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Supabase không trả lời 200 — có thể project đã bị tạm dừng, vào dashboard Supabase bấm Restore."
          exit 1
