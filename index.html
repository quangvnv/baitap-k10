<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- maximum-scale=5: cho phép chụm ngón phóng to trên điện thoại (§41.7) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Bài tập</title>
<link rel="stylesheet" href="baigiang.css?v=39">
<link rel="stylesheet" href="baigiang-word-choice.css?v=39">
<link rel="stylesheet" href="baigiang-crossword.css?v=39">
<link rel="stylesheet" href="baigiang-spk-reading-part5.css?v=39">
<link rel="stylesheet" href="baigiang-spk-reading-part6.css?v=39">
<link rel="stylesheet" href="baigiang-spk-listening-part1.css?v=39">
<link rel="stylesheet" href="baigiang-spk-writing-part8.css?v=39">
<link rel="stylesheet" href="baigiang-spk-writing-part9.css?v=39">
<link rel="stylesheet" href="baigiang-verb-form.css?v=39">
<link rel="stylesheet" href="baigiang-textbox.css?v=39">
<link rel="stylesheet" href="trang.css?v=39">
</head>
<body>

<!-- ══ MÀN 1: VÀO BÀI ══════════════════════════════════════════════════════════════════════
     ⚠ TRANG NÀY CHỈ DÀNH CHO HỌC VIÊN — form đăng nhập của CB/GV nằm ở gv.html, KHÔNG gộp
       vào đây (§41.4): học viên mở link trong lớp không nên thấy ô mật khẩu của giảng viên.
       Lối vào của GV thu về đúng một dòng chữ nhỏ ở chân hộp.
     ⚠ KHÔNG nạp thêm gì ở màn này: baigiang.css đã 117 KB và khoá cuộn trang (xem trang.css). -->
<div id="manVao" class="man">
  <div class="hop">
    <span class="kicker">Học viên</span>
    <h1 id="vaoTen">Bài tập</h1>
    <p class="phu" id="vaoPhu">Nhập mã để bắt đầu</p>

    <label class="nhan" for="oMaPhien">Mã phiên <span class="goiy">(giáo viên chiếu trên bảng)</span></label>
    <input id="oMaPhien" class="o o-ma" inputmode="numeric" autocomplete="off"
           maxlength="6" placeholder="000000">

    <label class="nhan" for="oMaHV">Mã học viên</label>
    <input id="oMaHV" class="o" autocomplete="off" placeholder="vd: qs2628-01">

    <button id="btVao" class="bt bt-chinh bt-lon bt-rong" style="margin-top:14px">Vào làm bài</button>
    <div id="vaoLoi" class="loi"></div>

    <div class="chan-hop">
      Cán bộ, giảng viên: <a href="gv.html">mở bảng theo dõi</a>
    </div>
  </div>
</div>

<!-- ══ MÀN 2: LÀM BÀI ══════════════════════════════════════════════════════════════════════
     Bố cục dọc: THANH TRÊN (☰ ‹ Nộp bài ›) · vùng slide chiếm phần còn lại; slide 960×540 được
     SCALE cho vừa chỗ trống. Menu mục lục slide là ngăn kéo mở bằng ☰. -->
<div id="manBai" class="man an">
  <!-- THANH TRÊN CÙNG (2026-10-02): ☰ · ‹ · Nộp bài · › (+ hạn giờ bên phải).
       ☰ chỉ hiện khi bài có NHIỀU slide (JS ẩn khi chỉ 1 slide); menu mục lục là NGĂN KÉO ở mọi cỡ màn. -->
  <header id="thanhTren" class="thanh-tren">
    <button id="btMenu" class="bt bt-menu" title="Danh sách slide">☰</button>
    <button id="btTruoc" class="bt bt-phu bt-canh" title="Slide trước">‹</button>
    <button id="btNop" class="bt bt-nop">Nộp bài</button>
    <button id="btSau" class="bt bt-phu bt-canh" title="Slide sau">›</button>
    <span id="dauGio" class="gio"></span>
  </header>

  <nav id="menuTrai" class="menu">
    <div class="menu-dau">
      <div class="menu-ten" id="menuTen">Bài tập</div>
      <div class="menu-phu" id="dauCau">Slide 1/1</div>
    </div>
    <!-- Mục lục slide — bấm để nhảy thẳng tới slide -->
    <div id="dsSlide" class="ds-slide"></div>
  </nav>
  <div id="menuNen" class="menu-nen"></div>

  <!-- .sl là khung slide của app (960×540). `#lopSlide` bị scale cho vừa vùng trống; `#khungTyLe`
       mang ĐÚNG kích thước SAU khi scale — transform không đổi hộp bố cục, thiếu bước này là
       khung 960×540 vẫn đòi chỗ và đẻ thanh cuộn dù nhìn đã vừa.
       Trên điện thoại, trang.css bỏ khung + bỏ scale (§41.7). -->
  <main id="sanKhau" class="san">
    <div id="khungTyLe" class="khung-ty-le">
      <div id="lopSlide" class="lop-slide"></div>
    </div>
    <!-- Thanh phát audio của bài nghe (§41.29). Chỉ hiện khi slide có audio; ở NGOÀI
         `#khungTyLe` nên không bị transform:scale làm chữ bé đi. -->
    <div id="thanhAudio" class="au-bar an">
      <div id="auTabs" class="au-nhom"></div>
      <audio id="auEl" controls preload="none"></audio>
      <div id="auBmks" class="au-nhom au-moc"></div>
    </div>
  </main>
</div>

<!-- ══ MÀN 3: ĐÃ NỘP ═══════════════════════════════════════════════════════════════════════ -->
<div id="manXong" class="man an">
  <div class="hop">
    <h1>Đã nộp bài</h1>
    <div id="xongDiem" class="diem">–</div>
    <div id="xongQs" class="qs"></div>
    <p id="xongNhan" class="phu"></p>
    <button id="btXemLai" class="bt bt-chinh bt-lon bt-rong an" style="margin-bottom:8px">Xem lại bài làm</button>
    <button id="btVeDau" class="bt bt-lon bt-rong">Về màn hình đầu</button>
  </div>
</div>

<div id="banner" class="banner an"></div>

<script src="cauhinh.js?v=39"></script>
<script src="cham-diem.js?v=39"></script>
<script src="engine.js?v=39"></script>
<script src="trang.js?v=39"></script>
</body>
</html>
